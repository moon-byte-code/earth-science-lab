<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하연샘 지구과학 실험실</title>
<meta name="description" content="깊이 있는 이해로 과학이 쉬워지는 시간">
<meta name="theme-color" content="#04060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#ecebf5;min-height:100vh;background:#04060f;-webkit-font-smoothing:antialiased;word-break:keep-all}

  /* ---------- 배경: 우주 + 실제 지구 사진 ---------- */
  .space{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#020308}
  #sky{position:absolute;inset:0}
  .earth{position:absolute;width:min(86vh,980px);aspect-ratio:1;right:-14vh;bottom:-34vh;border-radius:50%;
    background:url("images/earth.webp") center/cover no-repeat;
    box-shadow:0 0 40px rgba(170,200,255,.22),0 0 140px rgba(120,160,255,.12);
    animation:float 2.6s cubic-bezier(.2,.7,.2,1) both}
  @keyframes float{from{transform:translateY(10%);opacity:0}to{transform:none;opacity:1}}

  /* ---------- 상단 고정 배너 (둥근 반투명 카드) ---------- */
  .head{position:fixed;top:0;left:0;right:0;z-index:10;padding:16px 20px 0;pointer-events:none}
  .banner{pointer-events:auto;max-width:1040px;margin:0 auto;padding:26px 30px 18px;border-radius:26px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
    transition:padding .35s ease,border-radius .35s ease}
  .top{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.2em;color:rgba(255,255,255,.55)}
  h1{font-size:clamp(28px,4.6vw,48px);font-weight:800;letter-spacing:-.04em;line-height:1.15;margin-top:14px;
    transform-origin:left center;transition:font-size .35s ease,margin .35s ease}
  h1 em{font-style:normal;background:linear-gradient(100deg,#c4b5fd,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{display:flex;align-items:center;gap:12px;font-size:clamp(15px,1.8vw,18px);color:rgba(255,255,255,.72);margin-top:10px}
  .lead::before{content:"";width:28px;height:2px;background:rgba(255,255,255,.5);flex:none}
  .fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease,opacity .25s}
  .fold > div{overflow:hidden}

  .tabs{display:flex;gap:6px;margin-top:18px}
  .tab{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);font-family:inherit;
    font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  .tab:hover{background:rgba(255,255,255,.1);color:#fff}
  .tab.on{background:#fff;color:#0b0e22;border-color:#fff}

  /* ---------- 본문 ---------- */
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 28px 46vh}
  #spacer{height:260px}

  section{margin-top:14px;scroll-margin-top:calc(var(--headH,260px) + 14px)}
  #list{padding-top:26px}
  .acc-btn{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px 16px 16px;border-radius:20px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:inherit;font-family:inherit;text-align:left;cursor:pointer;transition:background .2s}
  .acc-btn:hover{background:rgba(255,255,255,.11)}
  .num{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;
    color:var(--c);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
  .acc-btn h2{flex:1;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .acc-btn h2 small{font-size:13px;font-weight:600;color:rgba(255,255,255,.5);margin-left:8px}
  .en{font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.5)}
  .chev{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10px;
    border:1px solid rgba(255,255,255,.2);color:#fff;transition:transform .3s}
  section.open .chev{transform:rotate(180deg)}

  .acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
  section.open .acc-panel{grid-template-rows:1fr}
  .acc-inner{overflow:hidden}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding:14px 0 10px}

  .card{display:flex;flex-direction:column;gap:12px;padding:26px;border-radius:14px;min-height:190px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);text-decoration:none;color:inherit;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    transition:background .25s,color .25s,transform .25s,border-color .25s}
  .card .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:23px;
    background:rgba(255,255,255,.1)}
  .card h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .card p{font-size:14.5px;color:rgba(255,255,255,.65);line-height:1.6;flex:1;transition:color .25s}
  .card .go{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--c);transition:color .25s}
  .card:hover{background:rgba(255,255,255,.92);color:#111;transform:translateY(-3px);border-color:#fff}
  .card:hover p{color:#555}
  .card:hover .go{color:#111}
  .empty{font-size:14.5px;color:rgba(255,255,255,.55);padding:16px 18px 6px}

  footer{position:relative;z-index:1;text-align:center;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.12em;
    margin-top:-90px;padding-bottom:28px}

  @media (max-width:600px){
    .head{padding:10px 12px 0}
    .banner{padding:20px 20px 14px;border-radius:22px}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
    .tab{padding:8px 2px;font-size:13px}
    .wrap{padding-left:18px;padding-right:18px}
    .en{display:none} .acc-btn{padding:14px} .acc-btn h2{font-size:18px}
    .earth{width:125vw;right:-40vw;bottom:-28vh}
  }
</style>
</head>
<body>
<div class="space">
  <canvas id="sky"></canvas>
  <div class="earth" role="img" aria-label="우주에서 본 지구"></div>
</div>

<header class="head" id="head">
  <div class="banner">
    <div class="fold"><div>
      <div class="top"><span>EARTH SCIENCE LAB</span><span id="cnt"></span></div>
    </div></div>
    <h1>하연샘 <em>지구과학</em> 실험실</h1>
    <div class="fold"><div>
      <p class="lead">깊이 있는 이해로 과학이 쉬워지는 시간</p>
    </div></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<div class="wrap">
  <div id="spacer"></div>
  <main id="list"></main>
</div>
<footer>© 하연샘 지구과학 실험실</footer>

<script>
/* =========================================================
   ✏️ 시뮬레이터 목록 — 새 시뮬레이터는 여기에만 추가하세요
   category 는 아래 CATEGORIES 의 name 중 하나로 쓰기
   ========================================================= */
const SIMULATORS = [
  { title:"별의 물리량", desc:"분광형과 표면 온도, 별의 색과 밝기의 관계", icon:"⭐", category:"별과 우주", url:"star-physics/" },
  // { title:"새 시뮬레이터", desc:"한 줄 설명", icon:"🌊", category:"대기와 해양", url:"폴더이름/" },
];
const CATEGORIES = [   // 위에서부터 01, 02, 03 순서
  { name:"대기와 해양", en:"Atmosphere & Ocean", color:"#38bdf8" },
  { name:"고체 지구",   en:"Solid Earth",        color:"#fb923c" },
  { name:"별과 우주",   en:"Stars & Universe",   color:"#a78bfa" },
];
/* ========================================================= */

const head = document.getElementById("head");
const spacer = document.getElementById("spacer");
document.getElementById("cnt").textContent = `${SIMULATORS.length} SIMULATORS`;

/* 아코디언: 시뮬레이터가 있는 단원만 열린 채로 시작 */
document.getElementById("list").innerHTML = CATEGORIES.map((c,i) => {
  const items = SIMULATORS.filter(s => s.category === c.name);
  const open = items.length > 0;
  return `<section class="${open ? "open" : ""}" id="sec${i}" style="--c:${c.color}">
    <button class="acc-btn" aria-expanded="${open}">
      <span class="num">0${i+1}</span>
      <h2>${c.name}<small>${items.length}</small></h2>
      <span class="en">${c.en.toUpperCase()}</span>
      <span class="chev">▼</span>
    </button>
    <div class="acc-panel"><div class="acc-inner">
      ${open ? `<div class="grid">${items.map(s => `
        <a class="card" href="${s.url}"><div class="ic">${s.icon}</div>
          <h3>${s.title}</h3><p>${s.desc}</p><div class="go">OPEN →</div></a>`).join("")}</div>`
        : `<div class="empty">새 시뮬레이터를 준비하고 있어요.</div>`}
    </div></div>
  </section>`;
}).join("");

document.querySelectorAll(".acc-btn").forEach(btn => btn.addEventListener("click", () => {
  const sec = btn.parentElement;
  sec.classList.toggle("open");
  btn.setAttribute("aria-expanded", sec.classList.contains("open"));
}));

/* 제목 배너는 화면 위에 그대로 고정 → 본문은 배너 높이만큼 아래에서 시작해서 그 아래로만 스크롤돼요 */
function fitHead(){
  const h = head.offsetHeight;
  spacer.style.height = h + 8 + "px";
  document.documentElement.style.setProperty("--headH", h + "px");
}
addEventListener("resize", fitHead); fitHead();
document.fonts && document.fonts.ready.then(fitHead);
addEventListener("scroll", () => spy(), {passive:true});

/* 바로가기 탭 */
const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = `<button class="tab on" data-i="-1">전체</button>` +
  CATEGORIES.map((c,i) => `<button class="tab" data-i="${i}">${c.name}</button>`).join("");
const setTab = i => tabsEl.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", +t.dataset.i === i));

let lockUntil = 0;
tabsEl.addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  const i = +t.dataset.i;
  setTab(i); lockUntil = Date.now() + 900;
  if (i < 0){ scrollTo({top:0, behavior:"smooth"}); return; }
  const sec = document.getElementById("sec"+i);
  sec.classList.add("open"); sec.querySelector(".acc-btn").setAttribute("aria-expanded", true);
  sec.scrollIntoView({behavior:"smooth", block:"start"});
});

function spy(){
  if (Date.now() < lockUntil) return;
  let cur = -1;
  if (scrollY > 20){
    const line = head.offsetHeight + 60;
    document.querySelectorAll("section").forEach((s,i) => { if (s.getBoundingClientRect().top < line) cur = i; });
  }
  setTab(cur);
}

/* 반짝이는 별 */
const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
let stars = [];
function resize(){
  const d = devicePixelRatio || 1;
  cv.width = innerWidth*d; cv.height = innerHeight*d; cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px";
  stars = Array.from({length: Math.round(innerWidth*innerHeight/3800)}, () => {
    const big = Math.random() < .06;
    return { x:Math.random()*cv.width, y:Math.random()*cv.height*.85,
      r:(big ? 1.3+Math.random() : .3+Math.random()*.9)*d, p:Math.random()*7, s:.4+Math.random()*1.2,
      c: Math.random()<.15 ? "#cfe0ff" : Math.random()<.1 ? "#ffe6c8" : "#fff" };
  });
}
let shoot = null;
function draw(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  for (const s of stars){
    ctx.globalAlpha = .3 + .7*Math.abs(Math.sin(s.p + t/1000*s.s));
    ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
  }
  /* 가끔 별똥별 */
  if (!shoot && Math.random() < .002) shoot = {x:Math.random()*cv.width*.8, y:Math.random()*cv.height*.3, l:0};
  if (shoot){
    shoot.l += 14*(devicePixelRatio||1);
    const len = 120*(devicePixelRatio||1), x = shoot.x + shoot.l, y = shoot.y + shoot.l*.45;
    const g = ctx.createLinearGradient(x-len, y-len*.45, x, y);
    g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,"rgba(255,255,255,.9)");
    ctx.globalAlpha = Math.max(0, 1 - shoot.l/900); ctx.strokeStyle = g; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x-len, y-len*.45); ctx.lineTo(x, y); ctx.stroke();
    if (shoot.l > 900) shoot = null;
  }
  requestAnimationFrame(draw);
}
addEventListener("resize", resize); resize(); requestAnimationFrame(draw);
</script>
</body>
</html>
