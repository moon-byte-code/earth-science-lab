<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하연샘 지구과학 실험실</title>
<meta name="description" content="깊이 있는 이해로 과학이 쉬워지는 시간">
<meta name="theme-color" content="#04060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#ecebf5;min-height:100vh;background:#04060f;-webkit-font-smoothing:antialiased;word-break:keep-all}

  /* ---------- 배경: 우주 + 실제 지구 사진 ---------- */
  .space{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#020308}
  #sky{position:absolute;inset:0}
  .earth{position:absolute;width:min(86vh,980px);aspect-ratio:1;right:-14vh;bottom:-34vh;border-radius:50%;
    background:url("images/earth.webp") center/cover no-repeat;
    box-shadow:0 0 40px rgba(170,200,255,.22),0 0 140px rgba(120,160,255,.12);
    animation:float 2.6s cubic-bezier(.2,.7,.2,1) both}
  @keyframes float{from{transform:translateY(10%);opacity:0}to{transform:none;opacity:1}}

  /* ---------- 상단 고정 배너 (둥근 반투명 카드) ---------- */
  .head{position:fixed;top:0;left:0;right:0;z-index:10;padding:16px 20px 0;pointer-events:none}
  .banner{pointer-events:auto;max-width:1040px;margin:0 auto;padding:26px 30px 18px;border-radius:26px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
    transition:padding .35s ease,border-radius .35s ease}
  .top{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.2em;color:rgba(255,255,255,.55)}
  h1{font-size:clamp(28px,4.6vw,48px);font-weight:800;letter-spacing:-.04em;line-height:1.15;margin-top:14px;
    transform-origin:left center;transition:font-size .35s ease,margin .35s ease}
  h1 em{font-style:normal;background:linear-gradient(100deg,#c4b5fd,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{display:flex;align-items:center;gap:12px;font-size:clamp(15px,1.8vw,18px);color:rgba(255,255,255,.72);margin-top:10px}
  .lead::before{content:"";width:28px;height:2px;background:rgba(255,255,255,.5);flex:none}
  .fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease,opacity .25s}
  .fold > div{overflow:hidden}

  .tabs{display:flex;gap:6px;margin-top:18px}
  .tab{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);font-family:inherit;
    font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  .tab:hover{background:rgba(255,255,255,.1);color:#fff}
  .tab.on{background:#fff;color:#0b0e22;border-color:#fff}


  /* ---------- 보기 전환 (시뮬레이터 / 질문 게시판) ---------- */
  .top{align-items:center}
  .seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);letter-spacing:0}
  .seg button{border:none;background:none;color:rgba(255,255,255,.7);font-family:inherit;font-size:13px;font-weight:600;
    padding:6px 14px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  .seg button:hover{color:#fff}
  .seg button.on{background:rgba(255,255,255,.92);color:#111}
  [hidden]{display:none !important}

  /* ---------- 질문 게시판 ---------- */
  #boardView{padding-top:26px}
  .static .acc-btn{cursor:default}
  .static .acc-btn:hover{background:rgba(255,255,255,.07)}
  .num.txt{font-size:12px;color:#fff}
  .pane{margin-top:14px;padding:24px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .field + .field{margin-top:22px}
  .label{display:block;font-size:14px;font-weight:700;margin-bottom:10px}
  .label small{font-weight:500;color:rgba(255,255,255,.5);margin-left:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);font-family:inherit;
    font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.2s}
  .chip:hover{background:rgba(255,255,255,.1);color:#fff}
  .chip.on{background:#fff;color:#111;border-color:#fff}
  .input,.textarea{width:100%;font-family:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .2s,background .2s}
  .input::placeholder,.textarea::placeholder{color:rgba(255,255,255,.4)}
  .input:focus,.textarea:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.09)}
  .textarea{min-height:130px;resize:vertical;line-height:1.6}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .row .input{flex:1;min-width:180px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(255,255,255,.8);cursor:pointer;user-select:none}
  .check input{width:18px;height:18px;accent-color:#fff;cursor:pointer}
  .check.off{opacity:.4;cursor:not-allowed}
  .hint{font-size:12.5px;color:rgba(255,255,255,.5);margin-top:8px;line-height:1.5}
  .counter{text-align:right;font-size:12px;color:rgba(255,255,255,.45);margin-top:6px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .submit{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
  .btn{border:none;font-family:inherit;font-size:15px;font-weight:700;padding:13px 24px;border-radius:999px;cursor:pointer;
    background:#fff;color:#111;transition:transform .15s,opacity .2s}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:wait;transform:none}
  .msg{font-size:14px;color:rgba(255,255,255,.8)}
  .msg.err{color:#fca5a5}

  .qlist{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .q{padding:22px 24px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .q-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.55)}
  .q-unit{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#fff;padding:3px 10px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
  .q-unit::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,#fff)}
  .q-text{font-size:16px;line-height:1.7;margin-top:12px;white-space:pre-wrap;word-break:break-word}
  .q-text::before{content:"Q. ";font-weight:800}
  .a{margin-top:14px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.07);border-left:3px solid rgba(255,255,255,.6)}
  .a b{display:block;font-size:12.5px;letter-spacing:.04em;color:rgba(255,255,255,.6);margin-bottom:6px}
  .a p{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .a.wait p{color:rgba(255,255,255,.5)}
  .note{padding:26px;text-align:center;font-size:14.5px;color:rgba(255,255,255,.6);border-radius:16px;
    background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18);line-height:1.6}

  /* ---------- 본문 ---------- */
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 28px 46vh}
  #spacer{height:260px}

  section{margin-top:14px;scroll-margin-top:calc(var(--headH,260px) + 14px)}
  #list{padding-top:26px}
  .acc-btn{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px 16px 16px;border-radius:20px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:inherit;font-family:inherit;text-align:left;cursor:pointer;transition:background .2s}
  .acc-btn:hover{background:rgba(255,255,255,.11)}
  .num{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;
    color:var(--c);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
  .acc-btn h2{flex:1;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .acc-btn h2 small{font-size:13px;font-weight:600;color:rgba(255,255,255,.5);margin-left:8px}
  .en{font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.5)}
  .chev{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10px;
    border:1px solid rgba(255,255,255,.2);color:#fff;transition:transform .3s}
  section.open .chev{transform:rotate(180deg)}

  .acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
  section.open .acc-panel{grid-template-rows:1fr}
  .acc-inner{overflow:hidden}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding:14px 0 10px}

  .card{display:flex;flex-direction:column;gap:12px;padding:26px;border-radius:14px;min-height:190px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);text-decoration:none;color:inherit;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    transition:background .25s,color .25s,transform .25s,border-color .25s}
  .card .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:23px;
    background:rgba(255,255,255,.1)}
  .card h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .card p{font-size:14.5px;color:rgba(255,255,255,.65);line-height:1.6;flex:1;transition:color .25s}
  .card .go{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--c);transition:color .25s}
  .card:hover{background:rgba(255,255,255,.92);color:#111;transform:translateY(-3px);border-color:#fff}
  .card:hover p{color:#555}
  .card:hover .go{color:#111}
  .empty{font-size:14.5px;color:rgba(255,255,255,.55);padding:16px 18px 6px}

  footer{position:relative;z-index:1;text-align:center;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.12em;
    margin-top:-90px;padding-bottom:28px}

  @media (max-width:600px){
    .head{padding:10px 12px 0}
    .banner{padding:20px 20px 14px;border-radius:22px}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
    .tab{padding:8px 2px;font-size:13px}
    .wrap{padding-left:18px;padding-right:18px}
    .en{display:none} .acc-btn{padding:14px} .acc-btn h2{font-size:18px}
    .earth{width:125vw;right:-40vw;bottom:-28vh}
    .top > span{display:none} .top{justify-content:flex-start}
    .pane{padding:18px} .q{padding:18px}
  }
</style>
</head>
<body>
<div class="space">
  <canvas id="sky"></canvas>
  <div class="earth" role="img" aria-label="우주에서 본 지구"></div>
</div>

<header class="head" id="head">
  <div class="banner">
    <div class="fold"><div>
      <div class="top"><span>EARTH SCIENCE LAB</span>
        <div class="seg" id="seg"><button data-view="sims" class="on">시뮬레이터</button><button data-view="board">질문 게시판</button></div>
      </div>
    </div></div>
    <h1>하연샘 <em>지구과학</em> 실험실</h1>
    <div class="fold"><div>
      <p class="lead">깊이 있는 이해로 과학이 쉬워지는 시간</p>
    </div></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<div class="wrap">
  <div id="spacer"></div>
  <main id="list"></main>

  <main id="boardView" hidden>
    <section class="static" style="--c:#fff">
      <div class="acc-btn"><span class="num txt">Q</span><h2>질문하기</h2><span class="en">ASK A QUESTION</span></div>
      <form class="pane" id="qform" autocomplete="off">
        <div class="field">
          <span class="label">단원</span>
          <div class="chips" id="unitChips"></div>
        </div>
        <div class="field">
          <label class="label" for="nick">닉네임<small>선택</small></label>
          <div class="row">
            <input class="input" id="nick" maxlength="20" placeholder="비워 두면 익명으로 보내져요">
            <label class="check off" id="showWrap"><input type="checkbox" id="showNick" disabled> 게시판에 닉네임 공개</label>
          </div>
          <p class="hint">공개를 체크하지 않으면 게시판에는 ‘익명’으로 보여요. (선생님은 닉네임을 볼 수 있어요)</p>
        </div>
        <div class="field">
          <label class="label" for="qtext">질문</label>
          <textarea class="textarea" id="qtext" maxlength="500" placeholder="궁금한 점을 자유롭게 적어 주세요"></textarea>
          <div class="counter"><span id="qcount">0</span> / 500</div>
        </div>
        <input class="hp" id="website" tabindex="-1" aria-hidden="true">
        <div class="submit">
          <span class="msg" id="qmsg"></span>
          <button class="btn" id="qbtn" type="submit">질문 보내기</button>
        </div>
      </form>
    </section>

    <section class="static" id="qa" style="--c:#fff">
      <div class="acc-btn"><span class="num txt">A</span><h2>질문 모아보기<small id="qa-count"></small></h2><span class="en">Q &amp; A BOARD</span></div>
      <div class="qlist" id="qlist"></div>
    </section>
  </main>
</div>
<footer>© 하연샘 지구과학 실험실</footer>

<script>
/* =========================================================
   ✏️ 시뮬레이터 목록 — 새 시뮬레이터는 여기에만 추가하세요
   category 는 아래 CATEGORIES 의 name 중 하나로 쓰기
   ========================================================= */
const SIMULATORS = [
  { title:"별의 물리량", desc:"분광형과 표면 온도, 별의 색과 밝기의 관계", icon:"⭐", category:"별과 우주", url:"star-physics/" },
  // { title:"새 시뮬레이터", desc:"한 줄 설명", icon:"🌊", category:"대기와 해양", url:"폴더이름/" },
];
const CATEGORIES = [   // 위에서부터 01, 02, 03 순서
  { name:"대기와 해양", en:"Atmosphere & Ocean", color:"#38bdf8" },
  { name:"고체 지구",   en:"Solid Earth",        color:"#fb923c" },
  { name:"별과 우주",   en:"Stars & Universe",   color:"#a78bfa" },
];
/* =========================================================
   ✏️ 질문 게시판 연결 주소 — 구글 Apps Script '웹 앱 URL'을 따옴표 안에 붙여 넣으세요
   ========================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPQ2GyKFR_tC9unUoLQDkYlgsW37QjK0UrtrgbNWJS_29tSnL_bYFxGvhqrjOfbE1CKQ/exec";
/* ========================================================= */

const head = document.getElementById("head");
const spacer = document.getElementById("spacer");

/* 아코디언: 시뮬레이터가 있는 단원만 열린 채로 시작 */
document.getElementById("list").innerHTML = CATEGORIES.map((c,i) => {
  const items = SIMULATORS.filter(s => s.category === c.name);
  const open = items.length > 0;
  return `<section class="${open ? "open" : ""}" id="sec${i}" style="--c:${c.color}">
    <button class="acc-btn" aria-expanded="${open}">
      <span class="num">0${i+1}</span>
      <h2>${c.name}<small>${items.length}</small></h2>
      <span class="en">${c.en.toUpperCase()}</span>
      <span class="chev">▼</span>
    </button>
    <div class="acc-panel"><div class="acc-inner">
      ${open ? `<div class="grid">${items.map(s => `
        <a class="card" href="${s.url}"><div class="ic">${s.icon}</div>
          <h3>${s.title}</h3><p>${s.desc}</p><div class="go">OPEN →</div></a>`).join("")}</div>`
        : `<div class="empty">새 시뮬레이터를 준비하고 있어요.</div>`}
    </div></div>
  </section>`;
}).join("");

document.querySelectorAll(".acc-btn").forEach(btn => btn.addEventListener("click", () => {
  const sec = btn.parentElement;
  sec.classList.toggle("open");
  btn.setAttribute("aria-expanded", sec.classList.contains("open"));
}));

/* 제목 배너는 화면 위에 그대로 고정 → 본문은 배너 높이만큼 아래에서 시작해서 그 아래로만 스크롤돼요 */
function fitHead(){
  const h = head.offsetHeight;
  spacer.style.height = h + 8 + "px";
  document.documentElement.style.setProperty("--headH", h + "px");
}
addEventListener("resize", fitHead); fitHead();
document.fonts && document.fonts.ready.then(fitHead);
addEventListener("scroll", () => spy(), {passive:true});

/* 바로가기 탭 */
const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = `<button class="tab on" data-i="-1">전체</button>` +
  CATEGORIES.map((c,i) => `<button class="tab" data-i="${i}">${c.name}</button>`).join("");
const setTab = i => tabsEl.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", +t.dataset.i === i));

let lockUntil = 0;
tabsEl.addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  const i = +t.dataset.i;
  setTab(i); lockUntil = Date.now() + 900;
  if (view === "board"){ filter = i; renderBoard(); if (i >= 0) pickUnit(CATEGORIES[i].name);
    scrollTo({top:0, behavior:"smooth"}); return; }
  if (i < 0){ scrollTo({top:0, behavior:"smooth"}); return; }
  const sec = document.getElementById("sec"+i);
  sec.classList.add("open"); sec.querySelector(".acc-btn").setAttribute("aria-expanded", true);
  sec.scrollIntoView({behavior:"smooth", block:"start"});
});

function spy(){
  if (view !== "sims" || Date.now() < lockUntil) return;
  let cur = -1;
  if (scrollY > 20){
    const line = head.offsetHeight + 60;
    document.querySelectorAll("section").forEach((s,i) => { if (s.getBoundingClientRect().top < line) cur = i; });
  }
  setTab(cur);
}


/* ================= 보기 전환 ================= */
let view = "sims", filter = -1;
const segEl = document.getElementById("seg");
function setView(v){
  view = v;
  segEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  document.getElementById("list").hidden = v !== "sims";
  document.getElementById("boardView").hidden = v !== "board";
  history.replaceState(null, "", v === "board" ? "#board" : location.pathname + location.search);
  filter = -1; setTab(-1); scrollTo({top:0});
  if (v === "board") loadBoard();
}
segEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) setView(b.dataset.view); });

/* ================= 질문 게시판 ================= */
const UNITS = [...CATEGORIES.map(c => c.name), "기타"];
const colorOf = u => (CATEGORIES.find(c => c.name === u) || {color:"#d1d5db"}).color;
const esc = t => String(t ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const DEMO = /demo/.test(location.search);
let items = null, unit = "";

const chipsEl = document.getElementById("unitChips");
chipsEl.innerHTML = UNITS.map(u => `<button type="button" class="chip" data-u="${u}">${u}</button>`).join("");
function pickUnit(u){ unit = u; chipsEl.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.u === u)); }
chipsEl.addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) pickUnit(c.dataset.u); });

const nick = document.getElementById("nick"), showNick = document.getElementById("showNick"), showWrap = document.getElementById("showWrap");
nick.addEventListener("input", () => {
  const has = nick.value.trim().length > 0;
  showNick.disabled = !has; showWrap.classList.toggle("off", !has); if (!has) showNick.checked = false;
});
const qtext = document.getElementById("qtext");
qtext.addEventListener("input", () => document.getElementById("qcount").textContent = qtext.value.length);

const qmsg = document.getElementById("qmsg"), qbtn = document.getElementById("qbtn");
function say(t, err){ qmsg.textContent = t; qmsg.classList.toggle("err", !!err); }

document.getElementById("qform").addEventListener("submit", async e => {
  e.preventDefault();
  const q = qtext.value.trim();
  if (!unit) return say("단원을 선택해 주세요.", true);
  if (q.length < 2) return say("질문을 입력해 주세요.", true);
  const data = { unit, nickname: nick.value.trim(), showNickname: showNick.checked, question: q,
                 website: document.getElementById("website").value };
  if (!SCRIPT_URL && !DEMO) return say("아직 질문 시트와 연결되지 않았어요.", true);
  qbtn.disabled = true; say("보내는 중…");
  try{
    let res = { ok:true };
    if (!DEMO){
      const r = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify(data) });
      res = await r.json();
    }
    if (!res.ok) throw new Error(res.error || "");
    qtext.value = ""; nick.value = ""; nick.dispatchEvent(new Event("input"));
    document.getElementById("qcount").textContent = 0;
    say("질문이 전달됐어요! 선생님이 확인하면 게시판에 올라와요 🙌");
  }catch(err){
    say(err.message || "전송에 실패했어요. 잠시 후 다시 시도해 주세요.", true);
  }finally{ qbtn.disabled = false; }
});

const SAMPLE = [
  { time:"2026-11-10T05:00:00Z", unit:"별과 우주", nickname:"별바라기", question:"분광형이 O형인 별이 왜 더 파랗게 보이나요?", answer:"표면 온도가 높을수록 최대 에너지를 방출하는 파장이 짧아지기 때문이에요(빈의 변위 법칙). 그래서 고온의 O형 별은 파란색으로 보여요." },
  { time:"2026-11-09T05:00:00Z", unit:"대기와 해양", nickname:"", question:"엘니뇨가 생기면 우리나라 날씨도 달라지나요?", answer:"" },
];

async function loadBoard(){
  const list = document.getElementById("qlist");
  if (!SCRIPT_URL && !DEMO){ items = []; list.innerHTML = `<div class="note">질문 게시판을 준비하고 있어요.</div>`; return; }
  if (!items) list.innerHTML = `<div class="note">질문을 불러오는 중…</div>`;
  try{
    if (DEMO) items = SAMPLE;
    else { const r = await fetch(SCRIPT_URL); const res = await r.json(); items = res.items || []; }
    renderBoard();
  }catch(err){
    list.innerHTML = `<div class="note">질문을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>`;
  }
}

function fmt(t){ const d = new Date(t); return isNaN(d) ? "" : `${d.getMonth()+1}월 ${d.getDate()}일`; }
function renderBoard(){
  if (!items) return;
  const list = document.getElementById("qlist");
  const shown = filter < 0 ? items : items.filter(x => x.unit === CATEGORIES[filter].name);
  document.getElementById("qa-count").textContent = shown.length;
  if (!SCRIPT_URL && !DEMO) return;
  list.innerHTML = shown.length ? shown.map(x => `
    <article class="q" style="--c:${colorOf(x.unit)}">
      <div class="q-meta"><span class="q-unit">${esc(x.unit)}</span><span>${esc(x.nickname || "익명")}</span><span>${fmt(x.time)}</span></div>
      <p class="q-text">${esc(x.question)}</p>
      <div class="a ${x.answer ? "" : "wait"}"><b>하연샘 답변</b><p>${x.answer ? esc(x.answer) : "답변을 준비하고 있어요."}</p></div>
    </article>`).join("")
    : `<div class="note">${filter < 0 ? "아직 올라온 질문이 없어요. 첫 질문을 남겨 보세요!" : "이 단원에는 아직 질문이 없어요."}</div>`;
}

if (location.hash === "#board") setView("board");

/* 반짝이는 별 */
const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
let stars = [];
function resize(){
  const d = devicePixelRatio || 1;
  cv.width = innerWidth*d; cv.height = innerHeight*d; cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px";
  stars = Array.from({length: Math.round(innerWidth*innerHeight/3800)}, () => {
    const big = Math.random() < .06;
    return { x:Math.random()*cv.width, y:Math.random()*cv.height*.85,
      r:(big ? 1.3+Math.random() : .3+Math.random()*.9)*d, p:Math.random()*7, s:.4+Math.random()*1.2,
      c: Math.random()<.15 ? "#cfe0ff" : Math.random()<.1 ? "#ffe6c8" : "#fff" };
  });
}
let shoot = null;
function draw(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  for (const s of stars){
    ctx.globalAlpha = .3 + .7*Math.abs(Math.sin(s.p + t/1000*s.s));
    ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
  }
  /* 가끔 별똥별 */
  if (!shoot && Math.random() < .002) shoot = {x:Math.random()*cv.width*.8, y:Math.random()*cv.height*.3, l:0};
  if (shoot){
    shoot.l += 14*(devicePixelRatio||1);
    const len = 120*(devicePixelRatio||1), x = shoot.x + shoot.l, y = shoot.y + shoot.l*.45;
    const g = ctx.createLinearGradient(x-len, y-len*.45, x, y);
    g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,"rgba(255,255,255,.9)");
    ctx.globalAlpha = Math.max(0, 1 - shoot.l/900); ctx.strokeStyle = g; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x-len, y-len*.45); ctx.lineTo(x, y); ctx.stroke();
    if (shoot.l > 900) shoot = null;
  }
  requestAnimationFrame(draw);
}
addEventListener("resize", resize); resize(); requestAnimationFrame(draw);
</script>
